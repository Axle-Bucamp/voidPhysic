[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "void-physics-life-simulation"
version = "1.0.0"
description = "A 3D particle physics simulation exploring the emergence of matter and complexity from a primordial void"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Void Physics Team", email = "contact@voidphysics.org"}
]
maintainers = [
    {name = "Void Physics Team", email = "contact@voidphysics.org"}
]
keywords = [
    "physics", "simulation", "particles", "emergence", "void-physics", 
    "3d", "visualization", "thermodynamics", "quantum-mechanics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "manim>=0.17.0",
    "pyvista>=0.40.0",
    "plotly>=5.0.0",
    "dash>=2.0.0",
    "dash-bootstrap-components>=1.0.0",
    "networkx>=2.6.0",
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "numba>=0.56.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "plotly-express>=0.4.0",
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
    "h5py>=3.0.0",
    "pyyaml>=6.0.0",
    "setuptools>=60.0.0",
    "wheel>=0.37.0",
    "sympy>=1.13.3",
]

[project.optional-dependencies]
# Enhanced visualization and interactivity
visualization = [
    "plotly>=5.0.0",
    "dash>=2.0.0",
    "dash-bootstrap-components>=1.0.0",
    "plotly-express>=0.4.0",
]

# Advanced features
advanced = [
    "networkx>=2.6.0",
    "numba>=0.56.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
]

# Development tools
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

# Jupyter support
jupyter = [
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
]

# All optional dependencies
all = [
    "plotly>=5.0.0",
    "dash>=2.0.0",
    "dash-bootstrap-components>=1.0.0",
    "networkx>=2.6.0",
    "numba>=0.56.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "plotly-express>=0.4.0",
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
]

[project.urls]
Homepage = "https://github.com/void-physics/void-physic"
Documentation = "https://void-physics.github.io/void-physic"
Repository = "https://github.com/void-physics/void-physic.git"
Issues = "https://github.com/void-physics/void-physic/issues"
Discussions = "https://github.com/void-physics/void-physic/discussions"

[project.scripts]
void-physics = "examples.void_physics_life_game:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["examples*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.toml", "*.json"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "dash.*",
    "dash_bootstrap_components.*",
    "networkx.*",
    "numba.*",
    "seaborn.*",
    "plotly_express.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "physics: physics-related tests",
    "visualization: visualization-related tests",
    "performance: performance-related tests",
    "integration: integration tests",
    "slow: slow-running tests",
]

[tool.coverage.run]
source = ["examples"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
