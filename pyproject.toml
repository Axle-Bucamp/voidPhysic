[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "void-physic"
version = "0.1.0"
description = "Mathematical modeling and visualization of void physics - spacetime emergence from topological void state"
authors = [
    {name = "Void Physics Research", email = "research@void-physic.org"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "manimgl>=1.7.0",
    "sympy>=1.12",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.6.0",
    "numba>=0.57.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "manim>=0.19.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "dash>=2.14.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/void-physic/void-physic"
Repository = "https://github.com/void-physic/void-physic.git"
Documentation = "https://void-physic.readthedocs.io"
"Bug Tracker" = "https://github.com/void-physic/void-physic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/void_physic"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/void_physic --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "manim.*",
    "numpy.*",
    "scipy.*",
    "matplotlib.*",
    "numba.*",
]
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
